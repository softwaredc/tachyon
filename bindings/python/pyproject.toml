[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tachyon"
version = "1.0.0"
description = "Zero-copy inter-process communication over shared memory"
readme = "../../README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["ipc", "shared-memory", "zero-copy", "ring-buffer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Interprocess Communication",
]

# No dependencies and no compiled extension: the binding is pure ctypes over
# libtachyon.so, so `pip install` never needs a compiler.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["tachyon"]

[tool.setuptools.package-dir]
tachyon = "tachyon"
